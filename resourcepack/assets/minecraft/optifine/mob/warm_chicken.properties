# Roostergenics - Custom Entity Models & Textures (OptiFine / EMF / ETF)
# Variant 1 = Común / Llanura / Bosque / Plains / Forest (chicken)
# Variant 2 = Árido / Savanna / Sabana (arid_chicken)
# Variant 3 = Frío / Ártico / Nieve / Polar (cold_chicken)
# Variant 4 = Ciénaga / Pantano / Manglar / Mire (mire_chicken)
# Variant 5 = Cálido / Desierto / Badlands / Meseta (warm_chicken)
# Variant 6 = Salvaje / Jungla / Bambú / Wild (wild_chicken)
# Variant 7 = Pinar / Pino / Taiga / Abeto / Spruce (pine_chicken)

# ==============================================================================
# SECCION 1: REGLAS POR NOMBRE (/rg spawn, compañeros /rg sacar, arenas)
# ==============================================================================
models.1=2
textures.1=2
name.1=regex:(?i).*(arido|arid|\u00e1rido|\u00e1rid|savann|saban|\u00a70\u00a72|[§&]0[§&]2).*

models.2=3
textures.2=3
name.2=regex:(?i).*(frio|fr\u00edo|cold|artic|artico|\u00e1rtic|\u00e1rtico|snow|polar|glaciar|\u00a70\u00a73|[§&]0[§&]3).*

models.3=4
textures.3=4
name.3=regex:(?i).*(cienag|ci\u00e9nag|pantan|mire|swamp|manglar|mangrove|\u00a70\u00a74|[§&]0[§&]4).*

models.4=5
textures.4=5
name.4=regex:(?i).*(calid|c\u00e1lid|warm|desiert|desert|badland|meset|mesa|\u00a70\u00a75|[§&]0[§&]5).*

models.5=6
textures.5=6
name.5=regex:(?i).*(salvaj|wild|jungl|bamboo|bamb\u00fa|\u00a70\u00a76|[§&]0[§&]6).*

models.6=7
textures.6=7
name.6=regex:(?i).*(pino|pine|pinar|taiga|abeto|spruce|\u00a70\u00a77|[§&]0[§&]7).*

models.7=1
textures.7=1
name.7=regex:(?i).*(comun|com\u00fan|plain|llanur|bosque|forest|dark_forest|dapple|pale_garden|cherry|default|\u00a70\u00a71|[§&]0[§&]1).*

